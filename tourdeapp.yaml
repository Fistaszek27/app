exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/shrimpsset/web
    port: 3000
    env:
      PORT: "3000"
      VITE_API_URL: "/api"
  - name: server
    image: registry.tourde.cloud/shrimpsset/server
    port: 3001
    env:
      PORT: "3001"
      PRODUCT_DB_HOST: 127.0.0.1
      PRODUCT_DB_NAME: product
      PRODUCT_DB_PORT: "3306"
      SPRING_DATASOURCE_PASSWORD: "strongPassword?"
      SPRING_DATASOURCE_USERNAME: tda_user
  - name: mysql
    image: mysql
    tag: "8.4"
    env:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: 1234
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/shrimpsset/caddy
    port: 80
build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    args:
      VITE_API_URL: "/api"
  - name: server
    context: ./backend
    dockerfile: ./backend/docker/Dockerfile
  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
